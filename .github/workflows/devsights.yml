name: DevSights

on:
  workflow_call:

# Railway URL بتاع DevSights
env:
  DEVSIGHTS_API_URL: https://YOUR-RAILWAY-URL.up.railway.app

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the user's repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install pytest
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # 4. Run tests
      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          pytest 2>&1 | tee test_output.txt

      # 5. Get commit information and send failure to DevSights
      - name: Send failure to DevSights
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'

          import json
          import os
          import urllib.request

          repo = os.environ["REPO"]
          commit_sha = os.environ["COMMIT_SHA"]
          github_token = os.environ["GH_TOKEN"]

          # ---------------------------------------------
          # Read pytest output
          # ---------------------------------------------

          with open("test_output.txt", "r", encoding="utf-8") as file:
              error_log = file.read()

          # ---------------------------------------------
          # Get commit information from GitHub API
          # ---------------------------------------------

          api_url = (
              f"https://api.github.com/repos/"
              f"{repo}/commits/{commit_sha}"
          )

          github_request = urllib.request.Request(
              url=api_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {github_token}",
                  "X-GitHub-Api-Version": "2022-11-28"
              },
              method="GET"
          )

          with urllib.request.urlopen(github_request) as response:
              commit_data = json.loads(
                  response.read().decode("utf-8")
              )

          # ---------------------------------------------
          # Extract commit information
          # ---------------------------------------------

          commit_message = commit_data["commit"]["message"]

          author = commit_data["commit"]["author"]["name"]

          changed_lines = []

          for file in commit_data.get("files", []):
              patch = file.get("patch")

              if patch:
                  for line in patch.splitlines():

                      # Get added lines only
                      # Ignore the +++ file header
                      if line.startswith("+") and not line.startswith("+++"):
                          changed_lines.append(line[1:])

          # ---------------------------------------------
          # Create FailureLog
          # ---------------------------------------------

          failure_data = {
              "build_id": os.environ["GITHUB_RUN_ID"],

              "error_log": error_log,

              "recent_commit": {
                  "commit_id": commit_sha,
                  "author": author,
                  "commit_message": commit_message,
                  "changed_lines": changed_lines
              }
          }

          # ---------------------------------------------
          # Convert to JSON
          # ---------------------------------------------

          json_data = json.dumps(
              failure_data
          ).encode("utf-8")

          # ---------------------------------------------
          # Send JSON to DevSights
          # ---------------------------------------------

          request = urllib.request.Request(
              url=os.environ["DEVSIGHTS_API_URL"] + "/errorAnalyze",
              data=json_data,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:

              with urllib.request.urlopen(request) as response:

                  result = response.read().decode("utf-8")

                  print("===================================")
                  print("DevSights response:")
                  print(result)
                  print("===================================")

          except Exception as error:

              print("===================================")
              print("Could not connect to DevSights:")
              print(error)
              print("===================================")

          PY

      # 6. Keep the workflow failed
      # if the user's tests failed
      - name: Mark workflow as failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
