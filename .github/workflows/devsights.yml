name: DevSights

on:
  workflow_call:
    secrets:
      DEVSIGHTS_API_URL:
        required: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the user's repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install pytest
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # 4. Run the user's tests
      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          pytest 2>&1 | tee test_output.txt

      # 5. Send the failure to DevSights
      - name: Send failure to DevSights
        if: steps.tests.outcome == 'failure'
        env:
          DEVSIGHTS_API_URL: ${{ secrets.DEVSIGHTS_API_URL }}
        run: |
          python - <<'PY'

          import json
          import os
          import urllib.request

          # Read the real pytest output
          with open("test_output.txt", "r", encoding="utf-8") as file:
              error_log = file.read()

          # Create the JSON sent to DevSights
          failure_data = {
              "build_id": os.environ["GITHUB_RUN_ID"],
              "error_log": error_log,
              "recent_commit": {
                  "commit_id": os.environ["GITHUB_SHA"],
                  "author": os.environ["GITHUB_ACTOR"],
                  "commit_message": "",
                  "changed_lines": []
              }
          }

          # Convert the data to JSON
          json_data = json.dumps(failure_data).encode("utf-8")

          # Send the request to FastAPI
          request = urllib.request.Request(
              url=os.environ["DEVSIGHTS_API_URL"] + "/errorAnalyze",
              data=json_data,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  result = response.read().decode("utf-8")

                  print("===================================")
                  print("DevSights response:")
                  print(result)
                  print("===================================")

          except Exception as error:
              print("Could not connect to DevSights:")
              print(error)

          PY

      # 6. Keep the user's workflow failed
      # if their tests actually failed
      - name: Mark workflow as failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
