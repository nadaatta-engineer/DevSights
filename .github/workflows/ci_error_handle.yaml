name: CI Error Handler

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
  - runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python (أو بيئة العمل الخاصة بك)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # pip install -r requirements.txt (أضف أوامر البناء أو الاختبار هنا)

    - name: Run Tests / Build
      run: |
        echo "Running your build and tests..."
        # ضع هنا أمر الاختبار الذي قد يتسبب في حدوث خطأ للإختبار
        # exit 1  <-- تجربة لإحداث خطأ متعمد

    # هذه الخطوة تعمل فقط إذا فشلت إحدى الخطوات السابقة
    - name: Send Error Log to Railway Server
      if: failure()
      env:
        RAILWAY_SERVER_URL: "https://your-railway-app-url.railway.app/errorAnalyze"
      run: |
        # جمع بيانات الـ Commit الحالي
        COMMIT_ID="${{ github.sha }}"
        AUTHOR="${{ github.actor }}"
        COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
        BUILD_ID="${{ github.run_id }}"
        
        # تجهيز محتوى الخطأ (يمكنك تخصيصه أو التقاط سجلات أحدث خطأ)
        ERROR_LOG="Build failed during GitHub Actions workflow execution for commit ${{ github.sha }}."

        # بناء هيكل الـ JSON المطابق لـ FailureLog في الكود لديك
        PAYLOAD=$(jq -n \
          --arg build_id "$BUILD_ID" \
          --arg error_log "$ERROR_LOG" \
          --arg commit_id "$COMMIT_ID" \
          --arg author "$AUTHOR" \
          --arg commit_msg "$COMMIT_MESSAGE" \
          '{
            build_id: $build_id,
            error_log: $error_log,
            recent_commit: {
              commit_id: $commit_id,
              author: $author,
              commit_message: $commit_msg,
              changed_lines: []
            }
          }')

        echo "Sending payload to server..."
        
        # إرسال الطلب واستقبال الرد
        RESPONSE=$(curl -s -X POST "$RAILWAY_SERVER_URL" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD")

        echo "Response from Railway Server:"
        echo "$RESPONSE"
