name: CI Error Handler

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Run Tests / Build
      run: |
        echo "Running your build and tests..."
        exit 1  # خطأ متعمد لاختبار عمل الـ Workflow

    - name: Send Error Log to Railway Server
      if: failure()
      env:
        RAILWAY_SERVER_URL: "https://devsights-production.up.railway.app/errorAnalyze"
      run: |
        COMMIT_ID="${{ github.sha }}"
        AUTHOR="${{ github.actor }}"
        COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
        BUILD_ID="${{ github.run_id }}"
        
        ERROR_LOG="Build failed during GitHub Actions workflow execution for commit ${{ github.sha }}."

        PAYLOAD=$(jq -n \
          --arg build_id "$BUILD_ID" \
          --arg error_log "$ERROR_LOG" \
          --arg commit_id "$COMMIT_ID" \
          --arg author "$AUTHOR" \
          --arg commit_msg "$COMMIT_MESSAGE" \
          '{
            build_id: $build_id,
            error_log: $error_log,
            recent_commit: {
              commit_id: $commit_id,
              author: $author,
              commit_message: $commit_msg,
              changed_lines: []
            }
          }')

        echo "Sending payload to server..."
        
        RESPONSE=$(curl -s -X POST "$RAILWAY_SERVER_URL" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD")

        echo "Response from Railway Server:"
        echo "$RESPONSE"
